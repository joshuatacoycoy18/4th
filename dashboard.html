<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control | Orbital Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header class="dash-header">
        <h1><i class="fa-solid fa-satellite"></i> Mission Control</h1>
        <a href="/" class="btn-home"><i class="fa-solid fa-power-off"></i> Disconnect</a>
    </header>

    <div class="dash-container">
        
        <!-- LEFT: MAP -->
        <div class="panel">
            <div class="panel-title"><i class="fa-solid fa-map-location-dot"></i> Live Orbital Map</div>
            <div id="map"></div>
        </div>

        <!-- RIGHT: DATA & CONTROLS -->
        <div style="display: flex; flex-direction: column; gap: 25px;">
            
            <!-- Telemetry Stats -->
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-chart-simple"></i> Telemetry Data</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Latitude</div>
                        <div class="stat-val highlight" id="val-lat">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Longitude</div>
                        <div class="stat-val highlight" id="val-lon">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Altitude</div>
                        <div class="stat-val" id="val-alt">-- m</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Satellites</div>
                        <div class="stat-val" id="val-sats">--</div>
                    </div>
                </div>
            </div>

            <!-- Hardware Diagnostics -->
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-microchip"></i> Diagnostics</div>
                <div class="hw-grid">
                    <div class="hw-item" id="hw-led">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>LED</span>
                    </div>
                    <div class="hw-item" id="hw-buzzer">
                        <i class="fa-solid fa-bell"></i>
                        <span>Buzzer</span>
                    </div>
                    <div class="hw-item">
                        <i class="fa-solid fa-tv"></i>
                        <span>OLED</span>
                        <div class="oled-text" id="hw-oled">--</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-sliders"></i> Command Center</div>
                <div class="controls">
                    <button class="btn-ctrl primary" onclick="centerMap()"><i class="fa-solid fa-crosshairs"></i> Center Target</button>
                    <button class="btn-ctrl" onclick="speakLocation()"><i class="fa-solid fa-volume-high"></i> Voice Telemetry</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- MAP SETUP ---
        const map = L.map('map', {zoomControl: false}).setView([14.5995, 120.9842], 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({position: 'bottomright'}).addTo(map);

        // Custom Glowing Marker
        const gpsIcon = L.divIcon({
            className: 'custom-icon',
            html: '<div style="background:#00f2fe;width:16px;height:16px;border-radius:50%;box-shadow:0 0 20px #00f2fe, 0 0 40px #00f2fe;border:2px solid white;"></div>',
            iconSize: [16, 16], iconAnchor: [8, 8]
        });
        
        let marker = L.marker([14.5995, 120.9842], {icon: gpsIcon}).addTo(map);
        let pathPoints = [];
        let polyline = L.polyline(pathPoints, {color: '#00f2fe', weight: 3, opacity: 0.6, dashArray: '5, 10'}).addTo(map);

        let currentLat = 14.5995, currentLon = 120.9842;

        // --- FETCH DATA ---
        function updateData() {
            // TANDAAN: /api/gps ang tamang endpoint, hindi /api/data
            fetch('/api/gps')
                .then(res => res.json())
                .then(data => {
                    currentLat = data.latitude;
                    currentLon = data.longitude;

                    // Update Text (with formatting)
                    document.getElementById('val-lat').innerText = data.latitude.toFixed(6);
                    document.getElementById('val-lon').innerText = data.longitude.toFixed(6);
                    document.getElementById('val-alt').innerText = data.altitude.toFixed(1) + ' m';
                    document.getElementById('val-sats').innerText = data.satellites;

                    // Update Map Position
                    let newPos = [data.latitude, data.longitude];
                    marker.setLatLng(newPos);
                    map.panTo(newPos);

                    // Update Trail
                    pathPoints.push(newPos);
                    if(pathPoints.length > 100) pathPoints.shift(); // Keep trail length manageable
                    polyline.setLatLngs(pathPoints);

                    // Update Hardware UI
                    const led = document.getElementById('hw-led');
                    const buzzer = document.getElementById('hw-buzzer');
                    const oled = document.getElementById('hw-oled');

                    if(data.led) led.classList.add('active-led');
                    else led.classList.remove('active-led');

                    if(data.buzzer) buzzer.classList.add('active-buzzer');
                    else buzzer.classList.remove('active-buzzer');

                    oled.innerText = data.oled_message;
                }).catch(e => console.error(e));
        }

        // --- CONTROLS ---
        function centerMap() {
            map.flyTo([currentLat, currentLon], 17);
        }

        function speakLocation() {
            if ('speechSynthesis' in window) {
                let text = `Target coordinates. Latitude ${currentLat.toFixed(5)}, Longitude ${currentLon.toFixed(5)}.`;
                let utterance = new SpeechSynthesisUtterance(text);
                speechSynthesis.speak(utterance);
            }
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
