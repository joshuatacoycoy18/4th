<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Logs | Orbital Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="stars-container"></div>
    <nav class="navbar">
        <a href="/" class="nav-brand"><i class="fa-solid fa-satellite-dish"></i> ORBITAL TRACKER</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/how-it-works">How It Works</a>
            <a href="/hardware">Hardware</a>
            <a href="/logs" class="active">Logs</a>
            <a href="/dashboard" class="nav-btn">Launch App</a>
        </div>
    </nav>
    <main class="page-container">
        <h1 class="page-title">Mission Logs</h1>
        <p class="page-subtitle">Historical telemetry data recorded by the system.</p>
        <div class="step-card" style="padding: 20px; border-left-color: var(--cyan);">
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Time</th><th>Latitude</th><th>Longitude</th><th>Altitude (m)</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <tr><td colspan="4" style="text-align: center;">Loading logs...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 80; i++) {
            let star = document.createElement('div'); star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw'; star.style.top = Math.random() * 100 + 'vh';
            let size = Math.random() * 2 + 1 + 'px'; star.style.width = size; star.style.height = size;
            star.style.animationDuration = Math.random() * 3 + 2 + 's';
            starsContainer.appendChild(star);
        }

        function fetchLogs() {
            fetch('/api/gps').then(res => res.json()).then(data => {
                const tbody = document.getElementById('log-body');
                tbody.innerHTML = '';
                
                // Check if history exists and has data
                if (!data.history || data.history.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted);">No logs recorded yet. Waiting for GPS data...</td></tr>';
                    return;
                }

                // Show newest logs first
                const reversedHistory = [...data.history].reverse();
                reversedHistory.forEach(log => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td style="color: var(--cyan); font-family: monospace;">${log.time}</td><td>${log.lat}</td><td>${log.lon}</td><td>${log.alt}</td>`;
                    tbody.appendChild(tr);
                });
            }).catch(e => console.error(e));
        }
        
        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
