<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Tracker | Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="stars-container"></div>
    <nav class="navbar">
        <a href="/" class="nav-brand"><i class="fa-solid fa-satellite-dish"></i> ORBITAL TRACKER</a>
        <div class="nav-links">
            <a href="/" class="active">Home</a>
            <a href="/how-it-works">How It Works</a>
            <a href="/hardware">Hardware</a>
            <a href="/logs">Logs</a>
            <a href="/dashboard" class="nav-btn">Launch App</a>
        </div>
    </nav>
    <header class="hero">
        <div class="hero-content">
            <div class="radar-container">
                <div class="radar-ring"></div>
                <div class="radar-ring"></div>
                <i class="fa-solid fa-satellite-dish radar-icon"></i>
            </div>
            <h1>Orbital Tracker</h1>
            <p>NEO-6M Telemetry Interface</p>
            <a href="/dashboard" class="btn-launch">Initialize System</a>
        </div>
    </header>
    <script>
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 80; i++) {
            let star = document.createElement('div'); star.className = 'star';
            star.style.left = Math.random() * 100 + 'vw'; star.style.top = Math.random() * 100 + 'vh';
            let size = Math.random() * 2 + 1 + 'px'; star.style.width = size; star.style.height = size;
            star.style.animationDuration = Math.random() * 3 + 2 + 's'; star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
